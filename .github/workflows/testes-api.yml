name: Testes de API (BDD) - Impacto Verde ESG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-api:
    name: Subir a API, rodar o Cucumber e guardar as evidências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Gerar tokens aleatórios (nada de segredo no repositório)
        run: |
          OPERADOR="$(openssl rand -hex 24)"
          ADMIN="$(openssl rand -hex 24)"
          echo "::add-mask::${OPERADOR}"
          echo "::add-mask::${ADMIN}"
          echo "API_TOKEN_OPERADOR=${OPERADOR}" >> "$GITHUB_ENV"
          echo "API_TOKEN_ADMIN=${ADMIN}" >> "$GITHUB_ENV"

      - name: Compilar a API de exemplo
        run: mvn -B -q -f api-exemplo/pom.xml -DskipTests clean package

      - name: Subir a API (somente loopback)
        run: |
          IMPACTO_VERDE_TOKEN_OPERADOR="${API_TOKEN_OPERADOR}" \
          IMPACTO_VERDE_TOKEN_ADMIN="${API_TOKEN_ADMIN}" \
          nohup java -jar api-exemplo/target/impacto-verde-api.jar > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "${API_BASE_URL}/api/v1/saude" > /dev/null; then echo "API no ar!"; exit 0; fi
            sleep 2
          done
          echo "A API não subiu a tempo"; cat api.log; exit 1

      - name: Executar os testes (Cucumber + REST Assured)
        run: mvn -B -f testes/pom.xml clean test

      - name: Resumo da execução
        if: always()
        run: |
          {
            echo "## Resultado dos testes de API"
            echo ""
            grep -hE "Tests run:.*Fail" testes/target/surefire-reports/*.txt || echo "Sem resumo disponível"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios do Cucumber (HTML, JSON e XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-cucumber
          path: |
            testes/target/cucumber-reports/
            testes/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar log da API (para depuração)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-da-api
          path: api.log
